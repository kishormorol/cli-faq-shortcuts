<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-label="An agent reads 1,146 past prompts and proposes four shortcuts: /signups, /sent, /project and /import, each with the sentence it replaces and how often it was asked.">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #c9d1d9; white-space: pre; }
    .dim { fill: #8b949e; }
    .you { fill: #e6edf3; font-weight: 600; }
    .cmd { fill: #7ee787; font-weight: 600; }
    .hdr { fill: #8b949e; }
    .num { fill: #79c0ff; }
    .ok  { fill: #d2a8ff; }
  </style>
  <rect width="880" height="330" rx="10" fill="#0d1117"/>
  <rect width="880" height="34" rx="10" fill="#161b22"/>
  <rect y="24" width="880" height="10" fill="#161b22"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="17" r="6" fill="#febc2e"/>
  <circle cx="60" cy="17" r="6" fill="#28c840"/>
  <text x="440" y="22" text-anchor="middle" class="dim" style="font-size:12px">~/my-app</text>

  <text x="24" y="68" class="dim">&gt; <tspan class="you">what do I keep asking in this project?</tspan></text>

  <text x="24" y="100" class="dim">Read 1,146 prompts over 41 days (Claude Code 912 · Codex 234)</text>

  <text x="24" y="136" class="hdr">SHORTCUT          REPLACES                                              ASKED</text>
  <text x="24" y="164"><tspan class="cmd">/signups</tspan>          "how many signed up this week, minus test accounts?"  <tspan class="num">   63</tspan></text>
  <text x="24" y="190"><tspan class="cmd">/sent</tspan>             "did the newsletter go out? did it reach everyone?"   <tspan class="num">   41</tspan></text>
  <text x="24" y="216"><tspan class="cmd">/project</tspan> &lt;name&gt;   "any update on the billing migration? what's blocked?" <tspan class="num">  28</tspan></text>
  <text x="24" y="242"><tspan class="cmd">/import</tspan> &lt;csv&gt;     "add these new customers, skip the ones we have"      <tspan class="num">   19</tspan></text>

  <text x="24" y="282" class="dim">Which should I write? Write and send shortcuts dry-run first and wait for yes.</text>
  <text x="24" y="306" class="ok">Loads in Claude Code · Codex · Cursor</text>
</svg>
