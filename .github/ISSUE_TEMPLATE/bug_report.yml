name: Bug report
description: Report an installation or history extraction problem.
body:
  - type: markdown
    attributes:
      value: Do not attach real history files, prompt exports, or Cursor databases. Use invented prompts and sanitized paths.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, agent and version, and installation method.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command with private paths replaced. Add a small synthetic record if helpful.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized error messages, without real prompts or credentials.
    validations:
      required: true
